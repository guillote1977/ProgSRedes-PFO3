<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" style="background:#f8fafc; font-family:'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Filtros de sombra -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="inner-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>

    <!-- Gradientes -->
    <linearGradient id="header-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="client-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    
    <linearGradient id="lb-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>

    <linearGradient id="worker-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <linearGradient id="mq-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>

    <linearGradient id="storage-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>

    <!-- Marcadores de Flecha -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#9333ea"/>
    </marker>
  </defs>

  <!-- Encabezado del Diagrama -->
  <rect x="0" y="0" width="1200" height="70" fill="url(#header-grad)"/>
  <text x="600" y="36" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="0.5">SISTEMA DISTRIBUIDO (CLIENTE - SERVIDOR) - ARQUITECTURA PFO 3</text>
  <text x="600" y="56" text-anchor="middle" fill="#94a3b8" font-size="13">Programación sobre Redes | IFTS N° 29</text>

  <!-- ================= CAPA 1: CLIENTES ================= -->
  <rect x="50" y="95" width="1100" height="110" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)"/>
  <rect x="50" y="95" width="220" height="30" rx="6" fill="#2563eb"/>
  <text x="160" y="115" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">CAPA 1: CLIENTES</text>

  <!-- Subcomponente: Móviles -->
  <rect x="300" y="120" width="260" height="65" rx="8" fill="url(#client-grad)" stroke="#93c5fd" stroke-width="1.5" filter="url(#inner-shadow)"/>
  <text x="340" y="148" font-size="22">📱</text>
  <text x="380" y="148" fill="#1e3a8a" font-size="14" font-weight="700">Dispositivos Móviles</text>
  <text x="380" y="166" fill="#3b82f6" font-size="12">Android / iOS (Sockets TCP / HTTP)</text>

  <!-- Subcomponente: Web -->
  <rect x="640" y="120" width="260" height="65" rx="8" fill="url(#client-grad)" stroke="#93c5fd" stroke-width="1.5" filter="url(#inner-shadow)"/>
  <text x="680" y="148" font-size="22">💻</text>
  <text x="720" y="148" fill="#1e3a8a" font-size="14" font-weight="700">Aplicaciones Web</text>
  <text x="720" y="166" fill="#3b82f6" font-size="12">SPA / Navegadores (REST / WebSockets)</text>

  <!-- Flechas hacia Balanceador -->
  <path d="M 430 185 L 430 225 L 530 245" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 770 185 L 770 225 L 670 245" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="600" y="222" text-anchor="middle" fill="#64748b" font-size="11" font-weight="600">Tráfico Entrante (TCP / TLS)</text>

  <!-- ================= CAPA 2: BALANCEADOR DE CARGA ================= -->
  <rect x="50" y="235" width="1100" height="95" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)"/>
  <rect x="50" y="235" width="250" height="30" rx="6" fill="#16a34a"/>
  <text x="175" y="255" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">CAPA 2: BALANCEO DE CARGA</text>

  <rect x="380" y="255" width="440" height="60" rx="8" fill="url(#lb-grad)" stroke="#86efac" stroke-width="1.5" filter="url(#inner-shadow)"/>
  <text x="415" y="291" font-size="22">⚖️</text>
  <text x="455" y="282" fill="#14532d" font-size="15" font-weight="700">Nginx / HAProxy Load Balancer</text>
  <text x="455" y="301" fill="#15803d" font-size="12">Distribución equitativa de conexiones (Round-Robin / Health-Checks)</text>

  <!-- Flechas hacia Workers -->
  <path d="M 480 315 L 340 370" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 720 315 L 860 370" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="350" text-anchor="middle" fill="#64748b" font-size="11" font-weight="600">Conexiones TCP Distribuidas</text>

  <!-- ================= CAPA 3: SERVIDORES WORKERS ================= -->
  <rect x="50" y="365" width="1100" height="175" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)"/>
  <rect x="50" y="365" width="280" height="30" rx="6" fill="#ca8a04"/>
  <text x="190" y="385" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">CAPA 3: SERVIDORES WORKERS</text>

  <!-- Worker 1 -->
  <rect x="150" y="405" width="410" height="115" rx="8" fill="url(#worker-grad)" stroke="#fde047" stroke-width="1.5" filter="url(#inner-shadow)"/>
  <text x="175" y="435" fill="#713f12" font-size="15" font-weight="700">⚙️ Servidor Worker 1 (servidor.py)</text>
  <text x="175" y="455" fill="#854d0e" font-size="12">Socket TCP en escucha + ThreadPoolExecutor</text>
  
  <rect x="175" y="468" width="75" height="36" rx="4" fill="#ffffff" stroke="#eab308"/>
  <text x="212" y="490" text-anchor="middle" fill="#713f12" font-size="11" font-weight="600">Hilo 1</text>
  <rect x="258" y="468" width="75" height="36" rx="4" fill="#ffffff" stroke="#eab308"/>
  <text x="295" y="490" text-anchor="middle" fill="#713f12" font-size="11" font-weight="600">Hilo 2</text>
  <rect x="341" y="468" width="75" height="36" rx="4" fill="#ffffff" stroke="#eab308"/>
  <text x="378" y="490" text-anchor="middle" fill="#713f12" font-size="11" font-weight="600">Hilo 3</text>
  <rect x="424" y="468" width="75" height="36" rx="4" fill="#ffffff" stroke="#eab308"/>
  <text x="461" y="490" text-anchor="middle" fill="#713f12" font-size="11" font-weight="600">Hilo 4 (Pool)</text>

  <!-- Worker 2 -->
  <rect x="640" y="405" width="410" height="115" rx="8" fill="url(#worker-grad)" stroke="#fde047" stroke-width="1.5" filter="url(#inner-shadow)"/>
  <text x="665" y="435" fill="#713f12" font-size="15" font-weight="700">⚙️ Servidor Worker 2 (servidor.py)</text>
  <text x="665" y="455" fill="#854d0e" font-size="12">Socket TCP en escucha + ThreadPoolExecutor</text>

  <rect x="665" y="468" width="75" height="36" rx="4" fill="#ffffff" stroke="#eab308"/>
  <text x="702" y="490" text-anchor="middle" fill="#713f12" font-size="11" font-weight="600">Hilo 1</text>
  <rect x="748" y="468" width="75" height="36" rx="4" fill="#ffffff" stroke="#eab308"/>
  <text x="785" y="490" text-anchor="middle" fill="#713f12" font-size="11" font-weight="600">Hilo 2</text>
  <rect x="831" y="468" width="75" height="36" rx="4" fill="#ffffff" stroke="#eab308"/>
  <text x="868" y="490" text-anchor="middle" fill="#713f12" font-size="11" font-weight="600">Hilo 3</text>
  <rect x="914" y="468" width="75" height="36" rx="4" fill="#ffffff" stroke="#eab308"/>
  <text x="951" y="490" text-anchor="middle" fill="#713f12" font-size="11" font-weight="600">Hilo 4 (Pool)</text>

  <!-- Flechas bidireccionales hacia Cola de Mensajes -->
  <path d="M 355 520 L 355 570 L 460 585" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <path d="M 845 520 L 845 570 L 740 585" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="600" y="565" text-anchor="middle" fill="#ea580c" font-size="11" font-weight="600">Publicar / Consumir Tareas (AMQP)</text>

  <!-- ================= CAPA 4: COLA DE MENSAJES ================= -->
  <rect x="50" y="580" width="1100" height="95" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)"/>
  <rect x="50" y="580" width="250" height="30" rx="6" fill="#ea580c"/>
  <text x="175" y="600" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">CAPA 4: COLA DE MENSAJES</text>

  <rect x="360" y="598" width="480" height="60" rx="8" fill="url(#mq-grad)" stroke="#fdba74" stroke-width="1.5" filter="url(#inner-shadow)"/>
  <text x="395" y="635" font-size="22">📩</text>
  <text x="435" y="625" fill="#7c2d12" font-size="15" font-weight="700">Broker RabbitMQ / Redis Task Queue</text>
  <text x="435" y="645" fill="#c2410c" font-size="12">Desacoplamiento asíncrono, persistencia de colas y tolerancia a fallos</text>

  <!-- Flechas hacia Almacenamiento -->
  <path d="M 480 658 L 360 720" fill="none" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <path d="M 720 658 L 840 720" fill="none" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="600" y="695" text-anchor="middle" fill="#9333ea" font-size="11" font-weight="600">Persistencia y Recuperación de Datos</text>

  <!-- ================= CAPA 5: ALMACENAMIENTO DISTRIBUIDO ================= -->
  <rect x="50" y="715" width="1100" height="145" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)"/>
  <rect x="50" y="715" width="310" height="30" rx="6" fill="#9333ea"/>
  <text x="205" y="735" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">CAPA 5: ALMACENAMIENTO DISTRIBUIDO</text>

  <!-- PostgreSQL -->
  <rect x="180" y="755" width="370" height="85" rx="8" fill="url(#storage-grad)" stroke="#d8b4fe" stroke-width="1.5" filter="url(#inner-shadow)"/>
  <text x="205" y="795" font-size="24">🗄️</text>
  <text x="250" y="785" fill="#581c87" font-size="15" font-weight="700">Cluster de Base de Datos PostgreSQL</text>
  <text x="250" y="805" fill="#7e22ce" font-size="12">• Metadatos de tareas y estados</text>
  <text x="250" y="822" fill="#7e22ce" font-size="12">• Usuarios, logs de auditoría y transacciones SQL</text>

  <!-- Amazon S3 -->
  <rect x="650" y="755" width="370" height="85" rx="8" fill="url(#storage-grad)" stroke="#d8b4fe" stroke-width="1.5" filter="url(#inner-shadow)"/>
  <text x="675" y="795" font-size="24">🪣</text>
  <text x="720" y="785" fill="#581c87" font-size="15" font-weight="700">Amazon S3 / MinIO Object Storage</text>
  <text x="720" y="805" fill="#7e22ce" font-size="12">• Archivos pesados, imágenes y adjuntos</text>
  <text x="720" y="822" fill="#7e22ce" font-size="12">• Backups inmutables y almacenamiento distribuido</text>

  <!-- Pie de página -->
  <text x="600" y="885" text-anchor="middle" fill="#94a3b8" font-size="12">Diseño y desarrollo conforme a las especificaciones de la PFO 3 - Arquitectura de Sistemas Distribuidos</text>
</svg>
